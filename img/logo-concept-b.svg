<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fenovera logo concept B — bold F mark on navy">
  <title>Fenovera — Concept B</title>

  <!-- Background pill for the mark -->
  <rect x="20" y="14" width="72" height="72" rx="6" fill="#1B2B4B"/>

  <!-- Teal accent square in mark -->
  <rect x="20" y="14" width="72" height="72" rx="6" fill="#0D7377" opacity="0.12"/>

  <!-- F letterform in white -->
  <!-- vertical stem -->
  <rect x="38" y="28" width="7" height="42" fill="white"/>
  <!-- top bar -->
  <rect x="38" y="28" width="30" height="7" fill="white"/>
  <!-- mid bar -->
  <rect x="38" y="48" width="22" height="6" fill="white"/>

  <!-- Tiny window mark bottom-right of the F block -->
  <rect x="63" y="59" width="16" height="16" rx="1" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <line x1="63" y1="67" x2="79" y2="67" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="71" y1="59" x2="71" y2="75" stroke="white" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="108" y="55" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1B2B4B" letter-spacing="5" font-weight="300">FENOVERA</text>

  <!-- Tagline -->
  <text x="108" y="73" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#0D7377" letter-spacing="4">WINDOWS &amp; DOORS</text>
</svg>
