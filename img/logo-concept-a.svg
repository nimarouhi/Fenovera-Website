<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fenovera logo concept A — classic window mark">
  <title>Fenovera — Concept A</title>

  <!-- Mark: four-pane window grid -->
  <g transform="translate(28, 22)">
    <!-- outer frame -->
    <rect x="0" y="0" width="64" height="64" rx="3" fill="none" stroke="#1B2B4B" stroke-width="3"/>
    <!-- horizontal bar -->
    <line x1="0" y1="30" x2="64" y2="30" stroke="#1B2B4B" stroke-width="2"/>
    <!-- vertical bar -->
    <line x1="32" y1="0" x2="32" y2="64" stroke="#1B2B4B" stroke-width="2"/>
    <!-- teal accent — top-right pane -->
    <rect x="34" y="2" width="28" height="26" fill="#0D7377" opacity="0.15"/>
  </g>

  <!-- Wordmark -->
  <text x="112" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2B4B" letter-spacing="4" font-weight="normal">FENOVERA</text>

  <!-- Rule -->
  <line x1="112" y1="62" x2="298" y2="62" stroke="#0D7377" stroke-width="1"/>

  <!-- Tagline -->
  <text x="112" y="76" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280" letter-spacing="3.5">WINDOWS &amp; DOORS</text>
</svg>
